kind = "web"
previewPath = "/"
title = "Pathashaala - Dining Seat Arrangement"
version = "1.0.0"
id = "artifacts/pathashaala"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22129
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/pathashaala run dev"

[services.env]
PORT = "22129"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/pathashaala", "run", "build"]
publicDir = "artifacts/pathashaala/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
